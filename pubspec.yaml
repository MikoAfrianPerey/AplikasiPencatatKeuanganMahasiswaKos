name: dompet_kos
description: Aplikasi pencatat keuangan mahasiswa kos dengan notifikasi lokal.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.0.0
  sqflite: ^2.2.8
  path_provider: ^2.1.1
  intl: ^0.19.0
  flutter_local_notifications: ^17.1.0
  timezone: ^0.9.2
  fl_chart: ^0.63.0
  cupertino_icons: ^1.0.2
  path: ^1.9.0
  sqflite_common_ffi_web: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  sqflite_common_ffi: ^2.3.4
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
